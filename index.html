<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея-слайдер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    #slider-window {
      position: relative;
      overflow: hidden;
    }

    #slider-track {
      transition: transform 0.3s ease;
      margin: 0;
      padding: 0;
    }

    .gallery-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      flex: 0 0 100%;
      border-radius: 8px;
    }

    @media (min-width: 768px) {
      .gallery-img {
        flex: 0 0 33.3333%;
      }
    }

    #pager button {
      width: 34px;
      height: 34px;
      padding: 0;
    }
  </style>
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width: 900px;">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Галерея</h1>

        <div class="d-flex align-items-center gap-2">
          <button id="prev-btn" type="button" class="btn btn-outline-primary" aria-label="Назад">&larr;</button>

          <div id="slider-window" class="flex-grow-1 overflow-hidden">
            <div id="slider-track" class="d-flex">
              <img src="images/1.jpg" alt="Изображение 1" class="gallery-img">
              <img src="images/2.jpg" alt="Изображение 2" class="gallery-img">
              <img src="images/3.jpg" alt="Изображение 3" class="gallery-img">
              <img src="images/4.jpg" alt="Изображение 4" class="gallery-img">
              <img src="images/5.jpg" alt="Изображение 5" class="gallery-img">
              <img src="images/6.jpg" alt="Изображение 6" class="gallery-img">
              <img src="images/7.jpg" alt="Изображение 7" class="gallery-img">
              <img src="images/8.jpg" alt="Изображение 8" class="gallery-img">
            </div>
          </div>

          <button id="next-btn" type="button" class="btn btn-outline-primary" aria-label="Вперёд">&rarr;</button>
        </div>

        <div id="pager" class="d-flex justify-content-center gap-2 mt-3" aria-label="Навигация по страницам"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js" defer></script>
</body>
</html>
