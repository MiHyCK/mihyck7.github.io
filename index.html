<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея-слайдер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width: 900px;">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Галерея</h1>

        <div class="d-flex align-items-center gap-2">
          <button id="prev-btn" type="button" class="btn btn-outline-primary" aria-label="Назад">&larr;</button>

          <div id="slider-window" class="flex-grow-1 overflow-hidden">
            <div id="slider-track" class="d-flex">
              <img src="https://picsum.photos/id/1015/600/400" alt="Изображение 1" class="gallery-img">
              <img src="https://picsum.photos/id/1016/600/400" alt="Изображение 2" class="gallery-img">
              <img src="https://picsum.photos/id/1018/600/400" alt="Изображение 3" class="gallery-img">
              <img src="https://picsum.photos/id/1019/600/400" alt="Изображение 4" class="gallery-img">
              <img src="https://picsum.photos/id/1020/600/400" alt="Изображение 5" class="gallery-img">
              <img src="https://picsum.photos/id/1021/600/400" alt="Изображение 6" class="gallery-img">
              <img src="https://picsum.photos/id/1022/600/400" alt="Изображение 7" class="gallery-img">
              <img src="https://picsum.photos/id/1024/600/400" alt="Изображение 8" class="gallery-img">
            </div>
          </div>

          <button id="next-btn" type="button" class="btn btn-outline-primary" aria-label="Вперёд">&rarr;</button>
        </div>

        <div id="pager" class="d-flex justify-content-center gap-2 mt-3" aria-label="Навигация по страницам"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js" defer></script>
</body>
</html>
